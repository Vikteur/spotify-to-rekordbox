name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time, and never cancel one halfway — a cancelled deploy can
# leave the box between two images.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: pytest
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install node deps
        run: npm ci

      # tsc --noEmit && vite build — typecheck and client build in one.
      - name: Build client
        run: npm run build

  build:
    name: Build image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase; the owner here is "Vikteur".
      - name: Compute image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}:${GITHUB_SHA}" >>"$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${repo}:latest" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" >~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          else
            # No pinned key: trust-on-first-use. Set the SSH_KNOWN_HOSTS secret
            # (ssh-keyscan output) to close this window.
            ssh-keyscan -H "$HETZNER_HOST" >~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship deploy files
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rekordmatch}"
          scp -i ~/.ssh/id_deploy \
            deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh \
            "${USER}@${HOST}:${APP_DIR}/"

      - name: Pull and restart
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rekordmatch}"
          # Token over stdin, never as an argv the box's process list can leak.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "${USER}@${HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/id_deploy "${USER}@${HOST}" \
            "chmod +x '${APP_DIR}/deploy.sh' && APP_DIR='${APP_DIR}' '${APP_DIR}/deploy.sh' '${IMAGE}'"

      - name: Summary
        if: always()
        run: echo "Deployed \`${{ needs.build.outputs.image }}\`" >>"$GITHUB_STEP_SUMMARY"
