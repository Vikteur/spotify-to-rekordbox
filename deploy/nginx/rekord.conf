# Rekord Match — DJ tool + wedding-guest magic links.
#
# One hostname, three containers (see docker-compose.yml):
#   /api/     -> the API (this repo)                 127.0.0.1:8000
#   /g/       -> the couple intake, Vikteur/rekord-couple  127.0.0.1:8082
#   /guest/   -> that app's bundle                        127.0.0.1:8082
#   /         -> the DJ app, Vikteur/rekord-dj            127.0.0.1:8081
#
# The app has no login of its own (built as a single-user local tool), and
# /api/couples/{id} returns a couple's magic-link tokens to any caller. So the
# DJ side is password-gated here, and only what a guest on their phone needs is
# left open.
upstream rekord_api    { server 127.0.0.1:8000; }
upstream rekord_dj     { server 127.0.0.1:8081; }
upstream rekord_couple { server 127.0.0.1:8082; }

server {
    listen 80;
    listen [::]:80;
    server_name rekord.viktorvansteenweghen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name rekord.viktorvansteenweghen.com;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;

    # rekordbox XML imports are capped at 256MB server-side (MAX_XML_BYTES).
    client_max_body_size 300m;

    # Inherited by every location below that doesn't override them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- open to guests --------------------------------------------------
    # A magic link is a secret in the URL, so this page must not leak its own
    # URL onward in a Referer header. The intake container sets that header
    # itself; it is repeated here because add_header in this block would
    # otherwise drop the inherited ones.
    location ^~ /g/ {
        auth_basic off;
        proxy_pass http://rekord_couple;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The JS/CSS bundle that guest page loads.
    location ^~ /guest/ {
        auth_basic off;
        proxy_pass http://rekord_couple;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The token in the path is this API's authentication.
    location ^~ /api/guest/ {
        auth_basic off;
        proxy_pass http://rekord_api;
    }

    # Uptime monitoring; returns only {"ok":true}.
    location = /api/health {
        auth_basic off;
        proxy_pass http://rekord_api;
    }

    # --- TEMPORARY: password gate switched off ---------------------------
    # Deliberately open for now. Restore by un-commenting the auth_basic
    # lines in the two blocks below — nothing else here has to change.
    #
    # While they are commented out, everything the gate used to cover is
    # public: the DJ UI, /api/scan (reads folders on this box), /api/library,
    # /api/export, and /api/couples — which returns every couple's
    # magic-link tokens to any caller (server/couples_api.py:91).

    # Everything else the DJ app calls.
    location ^~ /api/ {
        # auth_basic "Rekord Match";
        # auth_basic_user_file /etc/nginx/.htpasswd-rekord;
        proxy_pass http://rekord_api;
    }

    # The DJ app itself, including its /assets/ bundle.
    location / {
        # auth_basic "Rekord Match";
        # auth_basic_user_file /etc/nginx/.htpasswd-rekord;
        proxy_pass http://rekord_dj;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
